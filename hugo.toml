baseURL = 'https://crosser-of-river.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = "zh-cn"
title = 'ZCY’s Blog'
theme = "PaperMod"
disableKinds = ['taxonomy', 'term']
ignoreFiles = ['(^|/)_templates(/|$)']

[params]
defaultTheme = "auto"
disableThemeToggle = true
  comments = true
  description = "这是我的个人博客"
  BreadCrumbs = true
  breadcrumbSeparator = ">"
  [params.homeInfoParams]
    Title = "你好, 我是侦查员只吃鱼, 很高兴认识你. "
    Content = "不太痴愚的吃鱼"
  [params.profileMode]
    enabled = true
    imageHeight = 120
    imageTitle = "头像"
    imageUrl = "https://cdn.luogu.com.cn/upload/image_hosting/r5093zxy.png"
    imageWidth = 120
    subtitle = "不太痴愚的吃鱼"
    title = "吃鱼的自留地"

  [[params.profileMode.buttons]]
    name = "数学笔记"
    url = "/posts/math/"

  [[params.profileMode.buttons]]
    name = "渡河者说"
    url = "/posts/crosser-of-river/"

  [[params.profileMode.buttons]]
    name = "日记"
    url = "/posts/diaries/"

  [[params.profileMode.buttons]]
    name = "时间线"
    url = "/archives/"

  [[params.externalLinks]]
    name = "知乎"
    url = "https://www.zhihu.com/people/xian-ting-xin-bu-11-49"

  [[params.externalLinks]]
    name = "友情链接：diamond_153"
    url = "https://diamond153.netlify.app/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "时间线"
    url = "/archives/"
    weight = 30

# giscus 评论配置；仓库与分类 ID 来自 giscus 配置页面。
[params.giscus]
  enabled = true
  repo = "Crosser-of-River/investigatorzcy"
  repoID = "R_kgDOQqb69g"
  category = "Announcements"
  categoryID = "DIC_kwDOQqb69s4DHAre"

# 音乐放在 static/music/，例如 src = "/music/background.mp3"。
[params.music]
  enabled = true
  src = "/music/许嵩 - 乌鸦.mp3"
  title = "没什么品味的背景音乐-乌鸦"
