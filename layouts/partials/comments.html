{{- $config := site.Params.giscus -}}
{{- if and $config.enabled $config.repo $config.repoID $config.categoryID -}}
<section aria-label="文章评论">
  <h2>评论</h2>
  <p>使用 GitHub 账号登录后即可留言。</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ $config.repo }}"
    data-repo-id="{{ $config.repoID }}"
    data-category="{{ $config.category }}"
    data-category-id="{{ $config.categoryID }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async></script>
  <noscript>请启用 JavaScript，或前往 <a href="https://github.com/{{ $config.repo }}/discussions">GitHub Discussions</a> 阅读评论。</noscript>
</section>
{{- end -}}
