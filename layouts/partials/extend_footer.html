{{- $music := site.Params.music -}}
{{- if isset .Params "music" -}}{{- $music = .Params.music -}}{{- end -}}
<div id="page-music" hidden
  data-enabled="{{ if and $music.enabled $music.src }}true{{ else }}false{{ end }}"
  data-src="{{ with $music.src }}{{ . | relURL }}{{ end }}"
  data-title="{{ $music.title | default "背景音乐" }}"></div>
